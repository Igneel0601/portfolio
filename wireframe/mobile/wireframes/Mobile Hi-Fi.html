<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>igneel.dev · Mobile Hi-Fi</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hifi-components.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #111; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const {
  PhoneFrame, NavBar, NavOverlay,
  BootBlock, HeroSection, AccentRule, SectionHeader,
  ImgPlaceholder, ProjectCard, TimelineSection,
  CTASection, SiteFooter,
  FilterChips, WorkPageRow,
  WritingRow,
  ReadingProgress, CSBreadcrumb, CSHero,
  CSTextSection, StackPills, CSPager,
  T, TS, SERIF, MONO,
} = window;

/* ── DATA ─────────────────────────────────────────────────── */
const PROJECTS = [
  {
    id: "codeflow", index: "01", kind: "AI", name: "CodeFlow",
    blurb: "AI-powered website builder. Chat with agents in real-time E2B sandboxes and get a working Next.js app out the other side.",
    stack: ["next.js","react","tRPC","prisma","inngest","e2b","openai/gemini"],
    meta: "61 commits · solo",
  },
  {
    id: "taskforge", index: "02", kind: "REALTIME", name: "TaskForge",
    blurb: "Real-time Kanban with AI task elaboration. Liveblocks + Mongo, presence-aware boards that feel like Figma for tickets.",
    stack: ["next.js","liveblocks","mongodb","tailwind","nextauth"],
    meta: "shipped · live",
  },
  {
    id: "traveloop", index: "03", kind: "HACK", name: "Traveloop",
    blurb: "Odoo Hackathon · The Knights · group build, shipped on the clock. Itinerary planner with collaborative edits.",
    stack: ["next.js","react","prisma","postgres","tailwind","shadcn","nextauth"],
    meta: "hackathon · group of 4",
  },
];

const TIMELINE = [
  { when: "2022", title: "started at GBU",              blurb: "First lecture, first 'wait, I love this' moment." },
  { when: "2023", title: "exploring options",            blurb: "Half-finished side projects, late-night tutorials." },
  { when: "2024", title: "Web Developer Bootcamp",      blurb: "HTML → JS → React. Built the muscle memory." },
  { when: "2024", title: "switched to Arch full-time",  blurb: "arch-install scripts · ricing era · broke X11 a lot." },
  { when: "2025", title: "wall-engine on Hyprland",     blurb: "First OSS project to land stars (3★ / 1 fork)." },
  { when: "2025", title: "TaskForge ships",             blurb: "Real-time kanban · Liveblocks + Mongo." },
  { when: "2026", title: "CodeFlow goes live",          blurb: "AI app builder · E2B sandboxes · 61 commits." },
  { when: "2026", title: "Odoo Hackathon — Traveloop",  blurb: "Group build, weekend deadline, shipped." },
  { when: "NOW",  title: "just shipped a degree.",      blurb: "GBU · B.Tech CSE · looking for what's next.", isNow: true },
];

const WORK_ROWS = [
  { name: "CodeFlow",     tag: "product", status: "active",   blurb: "AI-powered website builder. E2B sandboxes + tRPC + Inngest.",                      slug: "codeflow"  },
  { name: "TaskForge",    tag: "product", status: "active",   blurb: "Real-time Kanban. Liveblocks presence, AI task elaboration.",                       slug: "taskforge" },
  { name: "Traveloop",    tag: "event",   status: "archived", blurb: "Odoo Hackathon build. Multi-city itinerary planner, shipped on the clock.",          slug: "traveloop" },
  { name: "wall-engine",  tag: "tool",    status: "active",   blurb: "Wallpaper switcher I built because I kept breaking the last one." },
  { name: "arch-install", tag: "tool",    status: "archived", blurb: "Scripted my Arch setup. Now it breaks less. I think." },
  { name: "…",            tag: "next",    status: "wip",      blurb: "Writing the README first this time." },
];

const WRITING = [
  { date: "may '26", title: "How I built an AI that writes its own Next.js apps",   kind: "build-log", readTime: "8 min" },
  { date: "apr '26", title: "Switching to Arch: one year later",                     kind: "til",       readTime: "4 min" },
  { date: "mar '26", title: "Real-time presence without WebSockets",                 kind: "essay",     readTime: "6 min" },
  { date: "jan '26", title: "Odoo Hackathon post-mortem",                            kind: "build-log", readTime: "5 min" },
  { date: "dec '25", title: "tRPC in 2026: still worth it?",                         kind: "essay",     readTime: "7 min" },
  { date: "nov '25", title: "Wall-engine: building a Hyprland wallpaper switcher",   kind: "build-log", readTime: "6 min" },
];

/* ── PAGE COMPOSITIONS ────────────────────────────────────── */
function HomePage() {
  return (
    <>
      <NavBar />
      <BootBlock />
      <HeroSection />
      <AccentRule />
      <SectionHeader eyebrow="$ ls ~/projects" title="three things I shipped." />
      {PROJECTS.map(p => <ProjectCard key={p.id} project={p} />)}
      <AccentRule />
      <TimelineSection stops={TIMELINE} />
      <CTASection />
      <SiteFooter />
    </>
  );
}

function WorkPage() {
  const GIT = [
    "a3f01b2 · docs(traveloop): wrote case study draft",
    "7c01d8a · feat(codeflow): add gemini provider",
    "1e7f9d4 · chore(arch-install): split out wm setup",
  ];
  return (
    <>
      <NavBar />
      <div style={{ padding: '16px 22px 6px', background: T.paper }}>
        <div style={{ fontFamily: MONO, fontSize: 10, color: T.accent2, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4 }}>
          <span style={{ fontSize: 12 }}>←</span> back home
        </div>
        <h1 style={{ ...TS.display, color: T.ink, margin: 0 }}>
          All projects<span style={{ color: T.accent }}>.</span>
        </h1>
      </div>
      <FilterChips chips={['all','product','event','tool','next']} active="all" />
      <div style={{ height: 1, background: `repeating-linear-gradient(90deg,${T.hair2} 0 12px,transparent 12px 16px)`, margin: '0 22px 0' }} />
      {WORK_ROWS.map((r, i) => <WorkPageRow key={i} row={r} />)}
      <div style={{ padding: '14px 22px 20px', borderTop: `1px dashed ${T.hair}` }}>
        <div style={{ fontFamily: MONO, fontSize: 9, color: T.inkDim, marginBottom: 6 }}>$ git log --oneline | head -3</div>
        {GIT.map((l, i) => (
          <div key={i} style={{ fontFamily: MONO, fontSize: 9, color: T.inkDim, paddingLeft: 14, lineHeight: 1.9 }}>{l}</div>
        ))}
        <div style={{ fontFamily: MONO, fontSize: 9, color: T.accent2, marginTop: 8, letterSpacing: '.08em', textTransform: 'uppercase' }}>
          FULL LOG ON GITHUB ↗
        </div>
      </div>
    </>
  );
}

function WritingPage() {
  return (
    <>
      <NavBar />
      <div style={{ padding: '18px 22px 4px', background: T.paper }}>
        <div style={{ ...TS.eyebrow, fontSize: 10, color: T.inkDim, marginBottom: 3 }}>$ ls ~/writing</div>
        <h1 style={{ ...TS.h1, color: T.ink, margin: 0 }}>
          writing<span style={{ color: T.accent }}>.</span>
        </h1>
      </div>
      <FilterChips chips={['all','til','essay','build-log']} active="all" />
      <div style={{ height: 1, background: `repeating-linear-gradient(90deg,${T.hair2} 0 12px,transparent 12px 16px)`, margin: '0 22px 4px' }} />
      {WRITING.map((p, i) => <WritingRow key={i} post={p} />)}
    </>
  );
}

function CaseStudyPage() {
  const p = PROJECTS[0];
  return (
    <>
      <NavBar stuck />
      <ReadingProgress pct={35} />
      <CSBreadcrumb slug={p.id} />
      <CSHero project={p} />
      <div style={{ borderTop: `1px solid ${T.hair}`, borderBottom: `1px solid ${T.hair}` }}>
        <ImgPlaceholder label="hero screenshot · 16:9" height={195} />
      </div>
      <CSTextSection title="WHAT?" lines={3} />
      <CSTextSection title="WHY?" lines={2} />
      <CSTextSection title="HOW?" lines={3} />
      <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: T.accent, padding: '11px 22px 3px' }}>STACK</div>
      <StackPills stack={p.stack} />
      <CSPager prev="taskforge" next="traveloop" />
    </>
  );
}

/* ── APP ──────────────────────────────────────────────────── */
function App() {
  return (
    <DesignCanvas title="igneel.dev · Mobile Hi-Fi">

      <DCSection id="s-home" title="Home · /">
        <DCArtboard id="home-full" label="Full page scroll" width={390} height={2620}>
          <PhoneFrame><HomePage /></PhoneFrame>
        </DCArtboard>
        <DCArtboard id="home-nav" label="Nav overlay" width={390} height={720}>
          <PhoneFrame><NavOverlay /></PhoneFrame>
        </DCArtboard>
      </DCSection>

      <DCSection id="s-work" title="Work · /work">
        <DCArtboard id="work-full" label="All projects · M2 rows" width={390} height={990}>
          <PhoneFrame><WorkPage /></PhoneFrame>
        </DCArtboard>
      </DCSection>

      <DCSection id="s-writing" title="Writing · /writing">
        <DCArtboard id="writing-full" label="Writing index" width={390} height={680}>
          <PhoneFrame><WritingPage /></PhoneFrame>
        </DCArtboard>
      </DCSection>

      <DCSection id="s-cs" title="Case Study · /work/codeflow">
        <DCArtboard id="cs-full" label="CodeFlow case study" width={390} height={1060}>
          <PhoneFrame><CaseStudyPage /></PhoneFrame>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
